# One-click deploy: https://render.com/deploy?repo=https://github.com/Abhinav0905/halftime
services:
  - type: web
    name: halftime
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: HALFTIME_DB
        value: ./data/halftime.db
      # Shared staff PIN for every page except the buyer menu and payments (see SECURITY.md).
      - key: STAFF_PIN
        sync: false
      # The hosted demo keeps "Reset demo data" (staff only, behind the PIN). Set to "false" for a real club.
      - key: DEMO_RESET_ENABLED
        value: "true"
